trigger:
  branches:
    include:
      - main # Trigger pipeline on changes to the main branch

pool:
  vmImage: 'ubuntu-latest' # Use an Ubuntu agent for the pipeline

variables:
  SFDX_CLI_VERSION: 'latest' # Specify Salesforce DX CLI version

steps:
- task: UseDotNet@2
  displayName: 'Install .NET Core SDK'
  inputs:
    version: '6.x' # Required for SFDX CLI

- script: |
    npm install sfdx-cli@${SFDX_CLI_VERSION} --global
    sfdx --version
  displayName: 'Install Salesforce DX CLI'

- script: |
    echo $(SalesforceUsername) | sfdx auth:jwt:grant --clientid $(SalesforceConsumerKey) --jwtkeyfile $(Agent.TempDirectory)/server.key --username $(SalesforceUsername) --instanceurl $(SalesforceTargetUrl) --setalias $(SalesforceAlias) --json
  displayName: 'Authenticate to Salesforce Org'
  env:
    SalesforceConsumerKey: $(SalesforceConsumerKey)
    SalesforceUsername: $(SalesforceUsername)
    SalesforceTargetUrl: $(SalesforceTargetUrl)
    SalesforceAlias: $(SalesforceAlias)
    SYSTEM_ACCESSTOKEN: $(System.AccessToken) # Used to access secure files

- task: DownloadSecureFile@1
  displayName: 'Download Server Key'
  inputs:
    secureFile: 'server.key' # Name of the secure file in Azure DevOps library

- script: |
    sfdx force:source:deploy --checkonly --targetusername $(SalesforceAlias) --sourcepath force-app --json
  displayName: 'Validate Deployment'

- script: |
    sfdx force:source:deploy --targetusername $(SalesforceAlias) --sourcepath force-app --json
  displayName: 'Deploy to Salesforce Org'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main')) # Deploy only on successful validation and main branch